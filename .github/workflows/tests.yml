name: Python tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run standalone package tests
        # The online adapter integration test needs the separate robot-side RLT runtime.
        run: python -m pytest tests -q --ignore=tests/test_online_rl.py
