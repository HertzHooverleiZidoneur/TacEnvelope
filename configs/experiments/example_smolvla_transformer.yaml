data:
  collection_manifest: ${DATASET_ROOT}/manifest.json
  robot_dataset: ${ROBOT_DATASET}
  tactile_root: ${TACTILE_ROOT}
  output_dir: ${OUTPUT_DIR}
  timestamp_field: null
  state_field: null
  action_field: null
  image_fields: null
  task_field: task
  action_sequence_available_at_anchor: false

alignment:
  window_ms: 300
  anchor_mode: auto
  anchor_stride_ms: 300
  action_steps: 9
  min_tactile_samples: 4
  min_samples_per_sensor: 4
  expected_sensors: [left_tip, right_tip]
  max_image_age_ms: 70
  drop_low_quality: true

causal_tactile_history:
  history_ms: 200
  steps: 6
  interpolation: false

stable_contact:
  tau_on: 5.0
  tau_off: 3.0
  tau_train: 5.0
  recent_samples: 4
  required_samples: 3
  magnitude_index: 3
  force_scale: 5.0
  cost_clip: 2.0
  hard_force_limit: null
  require_future_contact_ratio: false
  seeds: [42, 43, 44]
  variant_a_contact_weight: 1.5
  reuse_variant_a_seed: 44
  artifact_subdir: stable_contact_ab
  source_checkpoint: ${ENVELOPE_SOURCE_CHECKPOINT}
  evaluation_output_dir: ${OUTPUT_DIR}/stable_contact_gated_current

label:
  target_type: per_side_filtered_top2_mean
  sensor_names:
    left: left_tip
    right: right_tip
  baseline_ms: 1000
  gripper_index: -1
  baseline_min_open: 0.95
  baseline_max_residual_p95: 1.0
  require_contact_free_baseline: true
  contact_threshold: 5.0
  median_filter_size: 3
  force_axes: [force_fx, force_fy, force_fz]

vision:
  encoder: smolvla_condition
  checkpoint: ${SMOLVLA_CHECKPOINT}
  feature_tap: policy.model.vlm_with_expert.forward_past_key_values
  pooling: per_layer_key_value_masked_token_mean_then_head_mean_then_concat
  feature_contains_language: true
  feature_contains_robot_state: true
  camera_order:
    - observation.images.camera_camera_1_color_image_raw
    - observation.images.camera_camera_2_color_image_raw
    - observation.images.d515_color_image_raw
  batch_size: 32
  num_workers: 8

model:
  model_type: transformer_envelope
  d_model: 256
  num_heads: 8
  ffn_dim: 1024
  num_layers: 2
  dropout: 0.1
  log_var_min: -8.0
  log_var_max: 4.0
  use_tactile_history: true

training:
  seed: 44
  train_ratio: 0.70
  validation_ratio: 0.10
  calibration_ratio: 0.10
  test_ratio: 0.10
  batch_size: 128
  epochs: 80
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  device: cuda
  coverage: 0.95
  mixed_precision: true
  grad_clip: 1.0
  minimum_epochs: 20
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0001
  contact_sample_weight: 1.5
  smooth_l1_weight: 0.5
  artifact_subdir: tactile_history_ablation/weight_1.5_seed_44
  contact_recalibration_checkpoint: ${ENVELOPE_SOURCE_CHECKPOINT}
  contact_recalibration_output_dir: ${OUTPUT_DIR}/contact_recalibration
  sampling_rate_bins_hz: [18.0, 21.0]

analysis:
  checkpoint: ${ENVELOPE_ANALYSIS_CHECKPOINT}
  output_dir: ${OUTPUT_DIR}/tactile_history_checkpoint_analysis
  splits: [train, calibration, test]
  montage_split: test
  montage_top_k: 50
  phase_bins: 10

