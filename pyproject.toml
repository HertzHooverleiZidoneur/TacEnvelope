[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile-force-envelope"
version = "0.1.0"
description = "Vision-conditioned tactile force upper-envelope training"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
tactile-force-envelope = "tactile_force_envelope.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tactile_force_envelope*"]
